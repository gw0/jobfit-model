# nginx template (envsubst fills JOBFIT_MODEL_URL). SPA fallback plus gzip/caching; port 8080 because the container runs as non-root.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm;

    # The model's base URL, set per container (specs §8); overrides the dev default in public/.
    location = /config.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"modelUrl": "${JOBFIT_MODEL_URL}"}';
    }

    # A real 404 for missing model files: the SPA fallback below would answer index.html.
    location /models/ {
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
