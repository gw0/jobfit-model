# Argo Workflows controller from its upstream manifests, namespaced into `jobfit`.
# cluster-install rather than quick-start: the quick-starts also deploy a demo MinIO
# (whose pinned Docker Hub tag no longer pulls anonymously) that this pipeline, using
# only hostPath PVs, has no use for.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jobfit

resources:
  # Keep the version in sync with ARGO_VERSION in the Makefile.
  - github.com/argoproj/argo-workflows/manifests/cluster-install?ref=v3.6.2
  - executor-rbac.yaml

# Single-user local cluster: let the UI use the server's own service account instead of
# asking for a bearer token.
patches:
  - target:
      kind: Deployment
      name: argo-server
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --auth-mode=server
