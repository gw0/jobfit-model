# In-cluster address for pipeline pods: otel-collector.jobfit.svc.cluster.local:4317.
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
    - name: otlp-http
      port: 4318
    - name: prometheus
      port: 8889
    - name: self-metrics
      port: 8888
