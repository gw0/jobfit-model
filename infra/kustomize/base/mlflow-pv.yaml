# hostPath-backed PV (specs §7) -- a single-node cluster means every pod already
# shares one host, so object storage (S3/MinIO) would solve a multi-node problem this
# project doesn't have. Path is a subdirectory of the `runs` extraMount in
# infra/kind-config.yaml, so each scale's MLflow store lives in its runs_<SCALE>/mlflow/.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mlflow-data
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/runs/mlflow
    type: DirectoryOrCreate
