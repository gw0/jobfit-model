# Argo Workflows DAG (specs §6): prepare -> evaluate (zeroshot) -> finetune -> evaluate
# -> calibrate -> evaluate -> export -> evaluate -> publish, one shared jobfit-pipeline
# image. One workflow per candidate; every stage's MLflow run nests under a parent run
# named after the workflow (--run-group).
#
# Usage: argo submit -n jobfit pipeline/workflow.yaml --generate-name jobfit-<candidate>- \
#          -p model=<hf-id> [-p candidate=<name>] [-p gpus=1] [-p lora-rank=16 ...]
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: jobfit-run-
  namespace: jobfit
spec:
  entrypoint: pipeline
  # Bound to workflowtaskresults create/patch by infra/argo/executor-rbac.yaml.
  serviceAccountName: argo-workflow
  arguments:
    parameters:
      - name: model
        value: "Qwen/Qwen3-0.6B"
      # <runs-dir>/<candidate>/; empty means the model slug (pipeline/common.py).
      - name: candidate
        value: ""
      # NVIDIA GPUs per stage pod; 0 runs on CPU. >0 needs `make cluster-up GPU=1`.
      - name: gpus
        value: "0"
      - name: lora-rank
        value: "8"
      - name: lora-alpha
        value: "16"
      - name: lr-finetune
        value: "1e-4"
      - name: epochs-finetune
        value: "5"

  # `dataset` is the committed corpus, mounted read-only; `runs` holds pipeline output;
  # `cache` holds downloaded model weights (HF_HOME=/cache/huggingface in the image) so
  # they survive across stages and workflow runs instead of being re-downloaded each time.
  volumes:
    - name: dataset
      persistentVolumeClaim:
        claimName: dataset
    - name: runs
      persistentVolumeClaim:
        claimName: runs
    - name: cache
      persistentVolumeClaim:
        claimName: cache

  templates:
    - name: pipeline
      dag:
        tasks:
          - name: prepare
            template: stage
            arguments:
              parameters:
                - name: command
                  value: ./pipeline/prepare.py

          - name: evaluate-zeroshot
            dependencies: [prepare]
            template: stage
            arguments:
              parameters:
                - name: command
                  value: ./pipeline/evaluate.py --stage zeroshot

          - name: finetune
            dependencies: [evaluate-zeroshot]
            template: stage
            arguments:
              parameters:
                - name: command
                  value: >-
                    ./pipeline/train.py
                    --lr {{workflow.parameters.lr-finetune}}
                    --epochs {{workflow.parameters.epochs-finetune}}
                    --lora-rank {{workflow.parameters.lora-rank}}
                    --lora-alpha {{workflow.parameters.lora-alpha}}

          - name: evaluate-finetuned
            dependencies: [finetune]
            template: stage
            arguments:
              parameters:
                - name: command
                  value: ./pipeline/evaluate.py --stage finetuned

          - name: calibrate
            dependencies: [evaluate-finetuned]
            template: stage
            arguments:
              parameters:
                - name: command
                  value: ./pipeline/calibrate.py

          - name: evaluate-calibrated
            dependencies: [calibrate]
            template: stage
            arguments:
              parameters:
                - name: command
                  value: ./pipeline/evaluate.py --stage calibrated

          - name: export
            dependencies: [evaluate-calibrated]
            template: stage
            arguments:
              parameters:
                - name: command
                  value: ./pipeline/export.py

          - name: evaluate-quantized
            dependencies: [export]
            template: stage
            arguments:
              parameters:
                - name: command
                  value: ./pipeline/evaluate.py --stage quantized

          - name: publish
            dependencies: [evaluate-quantized]
            template: stage
            arguments:
              parameters:
                - name: command
                  value: ./pipeline/publish.py

    # One shared template, so pods are named <workflow>-stage-<hash>; the task name is in
    # the workflows.argoproj.io/node-name annotation (see `make cluster-logs`). It appends
    # the arguments every stage takes to the task's command.
    - name: stage
      inputs:
        parameters:
          - name: command
      # gpus=0 requests no GPU (an extended resource at 0 fits any node), so CPU and GPU
      # runs share this one template.
      podSpecPatch: |
        containers:
          - name: main
            resources:
              limits:
                nvidia.com/gpu: "{{workflow.parameters.gpus}}"
      container:
        image: jobfit-pipeline:latest
        # Loaded into the node by `kind load docker-image`; there is no registry to pull from.
        imagePullPolicy: IfNotPresent
        command: ["bash", "-c"]
        args:
          - >-
            {{inputs.parameters.command}}
            --dataset-dir /data --runs-dir /runs --model {{workflow.parameters.model}}
            --candidate '{{workflow.parameters.candidate}}' --run-group {{workflow.name}}
        env:
          - name: MLFLOW_TRACKING_URI
            value: "http://mlflow.jobfit.svc.cluster.local:5000"
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://otel-collector.jobfit.svc.cluster.local:4317"
        volumeMounts:
          - name: dataset
            mountPath: /data
            readOnly: true
          - name: runs
            mountPath: /runs
          - name: cache
            mountPath: /cache
